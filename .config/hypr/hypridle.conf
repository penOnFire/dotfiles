# ==============================================================================
# hypridle.conf - Idle management with MacLock and Touch ID
# Behaviors modeled after Windows 11 / macOS:
#  1. 2.5 min (150s): Dim display slightly to 20% brightness
#  2. 5 min   (300s): Lock session (MacLock with Touch ID)
#  3. 5.5 min (330s): Turn off display (DPMS off)
#  4. 15 min  (900s): Suspend laptop
# ==============================================================================

general {
    lock_cmd = sh /home/seanizonfire/.config/quickshell/MacLock/lock-via-ipc.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# 1. Dim screen brightness after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off screen backlight 30s after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend laptop after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
