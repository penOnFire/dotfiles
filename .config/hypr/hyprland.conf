# monitor = ,preferred,auto,1

# Internal Display: Scaled at 1.50 (Logical width becomes 1280)
monitor = eDP-1, 1920x1080@60, 0x0, 1.50

# External LG Display: Placed precisely at the edge of the 1.50 scaled space
monitor = HDMI-A-1, 1366x768@59.79, 1280x0, 1


$mainMod = SUPER

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7e9cd8ff)
    col.inactive_border = rgba(54546dff)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        noise = 0.02
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.2
   }

    shadow {
        enabled = false
    }
}

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.01, match:namespace waybar

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, smooth
    animation = windowsIn, 1, 4, smooth, popin 85%
    animation = windowsOut, 1, 3, smooth, popin 85%
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    preserve_split = true
}


# Environment variables for Qt styling
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct

exec-once = swaybg -i /home/seanizonfire/Downloads/wallpaper.png -m fill
exec-once = blueman-applet
# exec-once = swaync
exec-once = nm-applet --indicator
# exec-once = waybar
exec-once = hypridle
exec-once = ~/.local/bin/captive-portal-watch
# Execute on startup to set dark mode preference
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'


 
# bind = SUPER, N, exec, swaync-client -t
bind = $mainMod, RETURN, exec, kitty --single-instance
bind = $mainMod, Q, exec, kitty --single-instance
bind = $mainMod, R, exec, fuzzel
bind = $mainMod, E, exec, dolphin
bind = $mainMod SHIFT, F, exec, flatpak run app.zen_browser.zen
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen,
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, P, exec, ~/.local/bin/toggle-waybar
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod SHIFT, ESCAPE, exit,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Handled by MacShell block below (with OSD + fallback):
# bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = , XF86MonBrightnessUp, exec, brightnessctl -c backlight set +5%
# bindel = , XF86MonBrightnessDown, exec, brightnessctl -c backlight set 5%-

bind = $mainMod, F2, exec, brightnessctl -c backlight set 5%-
bind = $mainMod, F3, exec, brightnessctl -c backlight set +5%


layerrule = blur on, match:namespace wlogout
layerrule = ignore_alpha 0.05, match:namespace wlogout

# >>> MacShell (added by install.sh) >>>
exec-once = sh /home/seanizonfire/.config/quickshell/MacLock/enable-sleep-lock.sh
exec-once = sh /home/seanizonfire/.local/bin/macshell-start

# Liquid Glass: blur behind the shell surfaces
layerrule = blur on, match:namespace macdock
layerrule = ignore_alpha 0.2, match:namespace macdock
layerrule = no_anim on, match:namespace macdock

layerrule = blur on, match:namespace macspot
layerrule = ignore_alpha 0.05, match:namespace macspot
layerrule = no_anim on, match:namespace macspot

layerrule = blur on, match:namespace macbarbg
layerrule = ignore_alpha 0.05, match:namespace macbarbg
layerrule = no_anim on, match:namespace macbarbg

layerrule = no_anim on, match:namespace macshot

# MacShell keybinds
bind = SUPER, Z, exec, qs -c MacShell ipc call settings toggle
bind = SUPER, A, exec, qs -c MacShell ipc call controlcenter toggle
bind = SUPER SHIFT, C, exec, qs -c MacShell ipc call controlcenter toggle
bind = SUPER, N, exec, qs -c MacShell ipc call notifications open
bind = SUPER, V, exec, qs -c MacShell ipc call spotlight clipboard
bind = SUPER, period, exec, qs -c MacShell ipc call spotlight emoji
bind = SUPER, SPACE, exec, qs -c MacShell ipc call spotlight toggle
bind = ALT, TAB, exec, qs -c MacShell ipc call switcher next
bind = CTRL ALT, W, exec, qs -c MacShell ipc call wallpapers toggle
bind = , PRINT, exec, qs -c MacShell ipc call screenshot region

# MacLock (lock screen)
bind = SUPER, L, exec, sh ~/.config/quickshell/MacLock/lock-via-ipc.sh

# Hardware keys (with MacShell OSD + fallback when MacShell is not running)
bindel = , XF86AudioRaiseVolume, exec, sh -c 'qs -c MacShell ipc call hardware volumeUp >/dev/null 2>&1 || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, sh -c 'qs -c MacShell ipc call hardware volumeDown >/dev/null 2>&1 || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-'
bindl  = , XF86AudioMute, exec, sh -c 'qs -c MacShell ipc call hardware mute >/dev/null 2>&1 || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'
bindl  = , XF86AudioMicMute, exec, sh -c 'qs -c MacShell ipc call hardware micMute >/dev/null 2>&1 || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
bindel = , XF86MonBrightnessUp, exec, sh -c 'qs -c MacShell ipc call hardware brightnessUp >/dev/null 2>&1 || brightnessctl -q set 5%+'
bindel = , XF86MonBrightnessDown, exec, sh -c 'qs -c MacShell ipc call hardware brightnessDown >/dev/null 2>&1 || brightnessctl -q -n1 set 5%-'
bindel = , XF86KbdBrightnessUp, exec, brightnessctl -q -d '*kbd_backlight*' set 10%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -q -d '*kbd_backlight*' set 10%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
# <<< MacShell <<<



